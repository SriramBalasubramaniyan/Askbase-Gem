name: askbase_gem
description: Natural language query interface over any structured SQLite database, powered Gemini API.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # API
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  flutter_secure_storage: ^9.2.2
  flutter_dotenv: ^5.2.1

  # UI
  google_fonts: ^6.3.3
  flutter_markdown: ^0.7.3

  # Utilities
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/agri.db
    - .env

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500